[project]
id      = "blit"
version = "0.1.0"
module  = "blit.mach"
target  = "native"
src     = "src"
dep     = "dep"
out     = "out/{target}/bin/{name}{ext}"
obj     = "out/{target}/obj"
tests   = "out/{target}/test/{name}"

[target.linux]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.windows]
isa = "x86_64"
os  = "windows"
abi = "win64"
ext = ".exe"

[target.darwin]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[lib.blit]
entry = "blit.mach"
out   = "out/{target}/lib/lib{name}.a"

[deps.mach-std]
git = "https://github.com/octalide/mach-std"
ref = "branch/main"
